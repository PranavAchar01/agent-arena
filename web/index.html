<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Replay</title>
  <meta name="description" content="Type what a robot should do. An agent pulls openly licensed video of people doing it inside a throwaway sandbox, a VLM checks every clip, and an SO-101 policy is tuned and tested in simulation.">
  <meta name="theme-color" content="#07090c">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2307090c'/%3E%3Crect x='14' y='30' width='16' height='16' fill='%23ba483a'/%3E%3Crect x='34' y='18' width='16' height='28' fill='%23c4963e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="site.css?v=7">
  <script src="site.js?v=9" defer></script>
</head>
<body>
  <main class="page">
    <section class="hero" id="hero">
      <div class="hero-media" aria-hidden="true"><div class="hero-img"></div></div>
      <div class="hero-scrim" aria-hidden="true"></div>
      <header class="hero-bar">
        <span class="wordmark">Replay</span>
        <span class="hero-tag">Robot skills from a sentence</span>
      </header>

      <div class="hero-copy">
        <h1 class="title">I don't know what I want my robot to do yet.<br><em>So it learns from people on the open web.</em></h1>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="bar">
          <button type="button" class="robot-btn" id="robot-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="robot-dot"></span><span id="robot-label">SO-101</span>
            <svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1.5 1.5 6 6l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <label class="sr-only" for="prompt">What should it do?</label>
          <input class="prompt" id="prompt" type="text" maxlength="160" spellcheck="false" placeholder="Find a really easy workout an SO-101 can do">
          <button type="submit" class="cta" id="go">Train</button>
        </div>
        <div class="robot-list" id="robot-list" role="listbox" hidden>
          <button type="button" role="option" class="robot-opt is-on" data-robot="so101" aria-selected="true">
            <b>SO-101</b><span>5-DOF arm + gripper · simulated in MuJoCo</span></button>
          <button type="button" role="option" class="robot-opt" disabled><b>Koch v1.1</b><span>not in this demo</span></button>
          <button type="button" role="option" class="robot-opt" disabled><b>Unitree G1 arm</b><span>not in this demo</span></button>
        </div>
        <div class="chips" id="chips">
          <button type="button" class="chip" data-mode="workout" data-text="Find a really easy workout an SO-101 can do">Find a really easy workout an SO-101 can do</button>
          <button type="button" class="chip" data-family="place" data-text="put the block in the bowl">put the block in the bowl</button>
          <button type="button" class="chip" data-mode="chess" data-text="Replay Deep Blue vs. Kasparov, 1997, Game 6">Replay Deep Blue vs. Kasparov, 1997, Game 6</button>
        </div>
      </form>
    </section>

    <section class="fleet" id="fleet" hidden aria-label="Your robots">
      <header class="fleet-head">
        <h2>Your robots</h2>
        <p id="fleet-count"></p>
      </header>
      <form class="mini" id="composer2" autocomplete="off">
        <span class="mini-robot"><span class="robot-dot"></span>SO-101</span>
        <label class="sr-only" for="prompt2">Train another robot</label>
        <input class="prompt" id="prompt2" type="text" maxlength="160" spellcheck="false" placeholder="train another robot to…">
        <button type="submit" class="cta" id="go2">Train</button>
      </form>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <article class="sheet-panel">
      <header class="sheet-head">
        <div>
          <p class="sheet-kicker" id="sheet-kicker"></p>
          <h2 class="sheet-title" id="sheet-title"></h2>
        </div>
        <button type="button" class="close" id="sheet-close" aria-label="Close">
          <svg viewBox="0 0 14 14" aria-hidden="true"><path d="m2 2 10 10M12 2 2 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
    </article>
  </div>

  <footer class="foot"><p>MuJoCo physics (Google DeepMind) · official SO-101 model · simulated, hardware next</p></footer>
  <div class="grain" aria-hidden="true"></div>
</body>
</html>
